<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASSEBO NATURAL FOOD PRODUCTS - Sheet Barcode Generator</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- JsBarcode Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root {
            --bs-primary: #1b4332;
            --font-heading: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }
        body {
            background-color: #f8faf9;
            font-family: var(--font-sans);
            color: #2c3e50;
            margin: 0;
            padding: 0;
        }
        .brand-logo-img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border: 2px solid #d4af37;
            border-radius: 50%;
            background: #ffffff;
        }
        /* Optimized Grid Layout to eliminate excess whitespace */
        .barcode-sheet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4mm;
            padding: 0;
            background: #ffffff;
            width: 100%;
            margin: 0 auto;
        }
        .barcode-label-card {
            width: 100%;
            height: 35mm;
            background: #ffffff;
            border: 1px dashed #b0bec5;
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            page-break-inside: avoid;
            box-sizing: border-box;
        }
        
        /* Strict Print Rules to fit exact A4 page without spilling over or leaving white gaps */
        @media print {
            @page {
                size: A4;
                margin: 5mm;
            }
            body, html {
                width: 210mm;
                height: 297mm;
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            body * {
                visibility: hidden;
            }
            #printableSheetArea, #printableSheetArea * {
                visibility: visible;
            }
            #printableSheetArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 200mm;
                margin: 0 auto;
            }
            .no-print {
                display: none !important;
            }
            .barcode-label-card {
                border: 1px solid #000;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm py-2 px-3 no-print" style="background-color: #1b4332 !important;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="pos.html">
                <img src="logo.png" alt="Massebo Logo" class="brand-logo-img">
                <span class="fs-5" style="font-family: var(--font-heading);">MASSEBO POS</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="pos.html" class="btn btn-outline-light btn-sm rounded-pill px-4 fw-semibold">Back to POS</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4">
        
        <!-- Controls Header Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4 no-print">
            <h4 class="fw-bold text-success mb-2"><i class="bi bi-upc-scan me-2"></i>Multiple Barcode Sheet Printer</h4>
            <p class="text-muted small mb-3">Select a product and choose how many copies you want to generate to fit snugly across an A4 page.</p>
            
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted">Select Product:</label>
                    <select id="productSelect" class="form-select form-select-lg border shadow-sm fs-6" onchange="renderBarcodeSheet()">
                        <option value="" selected disabled>Loading products...</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold text-muted">Number of Copies:</label>
                    <select id="copiesSelect" class="form-select form-select-lg border shadow-sm fs-6" onchange="renderBarcodeSheet()">
                        <option value="12">12 Labels</option>
                        <option value="18">18 Labels</option>
                        <option value="24">24 Labels</option>
                        <option value="30" selected>30 Labels (Full A4 Page)</option>
                        <option value="33">33 Labels</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-success w-100 rounded-pill py-3 fw-bold shadow-sm" style="background-color: #1b4332;" onclick="window.print()">
                        <i class="bi bi-printer me-2"></i> Print Sheet
                    </button>
                </div>
            </div>
        </div>

        <!-- Printable Grid Area -->
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
            <div class="barcode-sheet-grid" id="printableSheetArea">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-success" role="status"></div>
                    <p class="text-muted small mt-2">Loading inventory...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script to Fetch Inventory and Render Multiple Duplicate Barcodes -->
    <script>
        let inventoryData = [];
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjUkDM3MwAzcxk2uqfd8sCuYMq7RJTQCCrES7WF4injsBhYPBJfWqrriUL3HTWQuVvRQ/exec";

        async function loadInventoryForSheet() {
            try {
                let response = await fetch(GOOGLE_APPS_SCRIPT_URL);
                inventoryData = await response.json();
                let selectEl = document.getElementById('productSelect');
                selectEl.innerHTML = '<option value="" selected disabled>Select a product...</option>';

                if (!inventoryData || inventoryData.length === 0) {
                    selectEl.innerHTML = '<option value="" disabled>No products found in database</option>';
                    return;
                }

                inventoryData.forEach((product, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${product.name} - Tshs ${Number(product.price).toLocaleString()}/=`;
                    selectEl.appendChild(option);
                });

                if (inventoryData.length > 0) {
                    selectEl.value = "0";
                    renderBarcodeSheet();
                }

            } catch (error) {
                console.error("Error loading inventory:", error);
                alert("Failed to load inventory from database.");
            }
        }

        function renderBarcodeSheet() {
            let selectEl = document.getElementById('productSelect');
            let selectedIndex = selectEl.value;
            if (selectedIndex === "") return;

            let product = inventoryData[selectedIndex];
            let copiesCount = parseInt(document.getElementById('copiesSelect').value);
            let barcodeVal = product.barcode ? product.barcode : "MSB-" + (1000 + Number(selectedIndex));
            let formattedPrice = `Tshs ${Number(product.price).toLocaleString()}/=`;

            let container = document.getElementById('printableSheetArea');
            container.innerHTML = '';

            for (let i = 0; i < copiesCount; i++) {
                let labelHTML = `
                    <div class="barcode-label-card">
                        <div class="w-100 text-center border-bottom pb-1">
                            <span class="fw-bold text-uppercase" style="font-size: 0.48rem; color: #1b4332; letter-spacing: 0.3px;">MASSEBO NATURAL FOOD PRODUCTS</span>
                        </div>
                        <div class="py-1 px-1 text-center w-100">
                            <h6 class="fw-bold text-dark text-truncate mb-0" style="font-size: 0.7rem;" title="${product.name}">${product.name}</h6>
                            <span class="text-success fw-bold" style="font-size: 0.7rem;">${formattedPrice}</span>
                        </div>
                        <div class="w-100 text-center">
                            <svg class="barcode-svg" data-code="${barcodeVal}" style="max-height: 28px; width: 100%;"></svg>
                        </div>
                    </div>
                `;
                container.innerHTML += labelHTML;
            }

            document.querySelectorAll('.barcode-svg').forEach(svg => {
                let code = svg.getAttribute('data-code');
                try {
                    JsBarcode(svg, code, {
                        format: "CODE128",
                        displayValue: true,
                        fontSize: 8,
                        height: 18,
                        width: 1,
                        margin: 0
                    });
                } catch (err) {
                    console.error("Barcode render error for: " + code, err);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadInventoryForSheet);
    </script>
</body>
</html>
